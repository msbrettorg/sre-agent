api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: top-resource-groups-by-cost
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Returns the top N resource groups by total effective cost for the last month. Useful for identifying cost
    concentration and major spenders at the resource group level. Author: FinOps Toolkit'
  database: Hub
  query: |-
    let N = ##N##;
    let startDate = ##startDate##; // Default: last month
    let endDate = ##endDate##;
    Costs()
    | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
    | summarize EffectiveCost = sum(EffectiveCost) by SubAccountName, x_ResourceGroupName
    | top N by EffectiveCost desc
  parameters:
  - name: N
    type: string
    description: 'Number of top resource groups to return (default: 5)'
    required: true
  - name: startDate
    type: string
    description: Start date for the reporting period (e.g., startofmonth(ago(30d)))
    required: true
  - name: endDate
    type: string
    description: End date for the reporting period (e.g., startofmonth(now()))
    required: true
