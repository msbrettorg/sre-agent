api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: ai-token-usage-breakdown
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Breaks Azure OpenAI token consumption down by model version and input/output direction. Calculates effective
    unit cost per token and cost per 1K tokens. Author: FinOps Toolkit Team'
  database: Hub
  query: |-
    let startDate = ##startDate##;
    let endDate = ##endDate##;
    Costs()
    | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
    | where x_SkuMeterSubcategory has "OpenAI"
    | extend Model = x_SkuDescription
    | extend Direction = case(
        Model has "Input", "Input",
        Model has "Output", "Output",
        "Other")
    | summarize
        TokenCount = sum(ConsumedQuantity),
        EffectiveCost = sum(EffectiveCost),
        BilledCost = sum(BilledCost),
        ListCost = sum(ListCost)
        by BillingCurrency, Model, Direction
    | extend UnitCostPerToken = iff(TokenCount == 0, 0.0, EffectiveCost / TokenCount)
    | extend CostPer1KTokens = UnitCostPerToken * 1000
    | order by EffectiveCost desc
  parameters:
  - name: startDate
    type: string
    description: Start date for the reporting period (e.g., startofmonth(ago(30d)))
    required: true
  - name: endDate
    type: string
    description: End date for the reporting period (e.g., startofmonth(now()))
    required: true
