api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: quota-compute-resource-skus
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: Rehydrates the latest virtual machine SKU family, availability zone, and restriction evidence from FinOps Hub quota data.
  database: Hub
  query: |-
    // Copyright (c) Microsoft Corporation.
    // Licensed under the MIT License.
    //
    // NAME: Compute resource SKUs
    // DESCRIPTION: Rehydrates the latest virtual machine SKU family, availability zone, and restriction evidence.
    // CATEGORY: Governance
    // FEATURE: Quota
    // REGION: All
    // TECH: KQL
    //
    // RESOURCE TYPES: virtualMachines
    //
    // SOURCE: Quota()
    //

    Quota()
    | where x_SourceType =~ 'ComputeResourceSku'
    | where ResourceType =~ 'virtualMachines'
    | where isnotempty(ResourceName) and isnotempty(location)
    | summarize arg_max(x_IngestionTime, *) by ResourceId
    | project
        ProviderName,
        ResourceId,
        ResourceName,
        ResourceType,
        SubAccountId,
        displayName,
        location,
        currentValue,
        limit,
        unit,
        x_QuotaDetails,
        x_SourceType,
        x_SourceVersion,
        x_IngestionTime
    | order by SubAccountId asc, location asc, ResourceName asc
