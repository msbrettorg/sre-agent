api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: cost-by-region-trend
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Returns total effective cost by region for a custom date range. Useful for regional cost breakdowns and optimization.
    Author: FinOps Toolkit Team'
  database: Hub
  query: |-
    let startDate = ##startDate##; // Set default as needed
    let endDate = ##endDate##;
    Costs()
    | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
    | summarize EffectiveCost = sum(EffectiveCost) by RegionName
    | order by EffectiveCost desc
  parameters:
  - name: startDate
    type: string
    description: Start date for the reporting period (e.g., startofmonth(ago(30d)))
    required: true
  - name: endDate
    type: string
    description: End date for the reporting period (e.g., startofmonth(now()))
    required: true
