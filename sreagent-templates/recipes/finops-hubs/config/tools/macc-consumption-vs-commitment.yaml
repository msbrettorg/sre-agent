api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: macc-consumption-vs-commitment
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Calculates monthly actual consumption versus monetary commitment for Microsoft Azure Consumption Commitment
    (MACC) billing accounts. Uses EffectiveCost from Costs() as the consumption numerator and x_MonetaryCommitment from Transactions()
    as the commitment denominator. KPI: Consumption versus Commitment Formula: Consumption versus Commitment = Actual Consumption
    Units / Committed Units Author: FinOps toolkit'
  database: Hub
  query: |-
    let startDate = ##startDate##;
    let endDate = ##endDate##;
    let profileConsumption =
        Costs()
        | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
        | where not(ChargeCategory == 'Purchase' and isnotempty(CommitmentDiscountCategory))
        | extend BillingAccountId = tolower(BillingAccountId)
        | extend ReportingMonth = startofmonth(ChargePeriodStart)
        | summarize ProfileConsumption = todouble(sum(EffectiveCost)) by BillingCurrency, BillingAccountId, x_BillingProfileId, ReportingMonth;
    let accountCommitment =
        Transactions()
        | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
        | where x_TransactionType in ('MACC', 'MonetaryCommitment', 'Microsoft Azure Consumption Commitment')
            or isnotnull(x_MonetaryCommitment)
        | extend BillingAccountId = tolower(BillingAccountId)
        | extend ReportingMonth = startofmonth(ChargePeriodStart)
        // VALIDATE on a MACC-active hub: sum(x_MonetaryCommitment) represents the total MACC obligation for the window.
        // If the Hub deployment records this repeatedly per billing period instead of once per purchase,
        // switch to max() or scan for the most-recent MACC event per period.
        | summarize AccountCommitment = todouble(sum(x_MonetaryCommitment)) by BillingCurrency, BillingAccountId, ReportingMonth;
    profileConsumption
    | join kind=leftouter (
        profileConsumption
        | summarize AccountConsumption = sum(ProfileConsumption) by BillingCurrency, BillingAccountId, ReportingMonth
    ) on BillingCurrency, BillingAccountId, ReportingMonth
    | join kind=leftouter accountCommitment on BillingCurrency, BillingAccountId, ReportingMonth
    | extend AccountCommitment = todouble(coalesce(AccountCommitment, 0.0))
    | extend ProfileShare = iff(AccountConsumption == 0.0, 0.0, ProfileConsumption / AccountConsumption)
    | extend ConsumptionAmount = ProfileConsumption
    | extend CommitmentAmount = AccountCommitment * ProfileShare
    | extend ConsumptionVsCommitmentRatio = iff(CommitmentAmount == 0.0, 0.0, ConsumptionAmount / CommitmentAmount)
    | extend CommitmentBurnPercent = ConsumptionVsCommitmentRatio * 100.0
    | project BillingCurrency, BillingProfileId = x_BillingProfileId, ReportingMonth, ConsumptionAmount, CommitmentAmount, ConsumptionVsCommitmentRatio, CommitmentBurnPercent
  parameters:
  - name: startDate
    type: string
    description: datetime = startofmonth(ago(30d))
    required: true
  - name: endDate
    type: string
    description: datetime = startofmonth(now())
    required: true
