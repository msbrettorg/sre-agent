api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: monthly-cost-trend
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Returns total billed and effective cost by month for the last N months (default: 12). Useful for visualizing
    both billed and effective cost trends over time. Author: FinOps Toolkit Team'
  database: Hub
  query: |-
    let startDate = ##startDate##; // Default: 12 months
    let endDate = ##endDate##;
    Costs()
    | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
    | extend x_ChargeMonth = startofmonth(ChargePeriodStart)
    | summarize BilledCost = sum(BilledCost), EffectiveCost = sum(EffectiveCost) by x_ChargeMonth
    | order by x_ChargeMonth asc
  parameters:
  - name: startDate
    type: string
    description: Start date for the reporting period (e.g., startofmonth(ago(365d)))
    required: true
  - name: endDate
    type: string
    description: End date for the reporting period (e.g., startofmonth(now()))
    required: true
