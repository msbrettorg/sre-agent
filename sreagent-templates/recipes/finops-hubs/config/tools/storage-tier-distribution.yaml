api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: storage-tier-distribution
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Summarizes storage usage by access-tier bucket and shows the share of spend and normalized GB-months on Frequent,
    Infrequent, and Unclassified storage tiers for each billing currency. KPI: Percent Storage on Frequent Access Tier Formula:
    Number of GB in Standard (or ''frequently accessed'' tiers) vs. total GBs stored Author: FinOps toolkit'
  database: Hub
  query: |-
    let startDate = ##startDate##;
    let endDate = ##endDate##;
    let bucketedCosts =
        Costs()
        | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
        | where ServiceCategory == 'Storage' and ChargeCategory == 'Usage'
        | extend TierBucket = case(
            x_SkuTier in ('Hot', 'Standard', 'Premium'), 'Frequent',
            x_SkuTier in ('Cool', 'Cold', 'Archive'), 'Infrequent',
            x_SkuMeterSubcategory has_any ('Hot LRS', 'Hot ZRS', 'Hot GRS', 'Standard', 'Premium', 'Frequent'), 'Frequent',
            x_SkuMeterSubcategory has_any ('Cool', 'Cold', 'Archive'), 'Infrequent',
            'Unclassified')
        | extend GBMonths = todouble(case(
            ConsumedUnit contains 'PB', todouble(ConsumedQuantity) * 1048576.0,
            ConsumedUnit contains 'TB', todouble(ConsumedQuantity) * 1024.0,
            ConsumedUnit contains 'MB', todouble(ConsumedQuantity) / 1024.0,
            todouble(ConsumedQuantity)));
    let totalsByCurrency =
        bucketedCosts
        | summarize
            TotalEffectiveCost = sum(EffectiveCost),
            TotalGBMonths = sum(GBMonths)
            by BillingCurrency;
    bucketedCosts
    | summarize
        EffectiveCost = todouble(sum(EffectiveCost)),
        GBMonths = todouble(sum(GBMonths))
        by BillingCurrency, TierBucket
    | join kind=inner totalsByCurrency on BillingCurrency
    | project
        BillingCurrency,
        TierBucket,
        EffectiveCost,
        GBMonths,
        CostPercent = todouble(iff(todouble(TotalEffectiveCost) == 0.0, 0.0, EffectiveCost / todouble(TotalEffectiveCost) * 100.0)),
        GBPercent = todouble(iff(TotalGBMonths == 0.0, 0.0, GBMonths / TotalGBMonths * 100.0))
  parameters:
  - name: startDate
    type: string
    description: datetime = startofmonth(ago(30d))
    required: true
  - name: endDate
    type: string
    description: datetime = startofmonth(now())
    required: true
