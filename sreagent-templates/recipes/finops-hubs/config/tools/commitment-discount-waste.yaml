api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: commitment-discount-waste
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Computes the percentage of commitment discount waste for each commitment by comparing unused amortized EffectiveCost
    to total commitment EffectiveCost. Includes a grand-total row per BillingCurrency across all commitments in the reporting
    window. KPI: Percentage of Commitment Discount Waste Formula: (Cost of Commitment Discount unused / total cost Commitment
    Discount) x 100 Author: FinOps toolkit'
  database: Hub
  query: |-
    let startDate = ##startDate##;
    let endDate = ##endDate##;
    let filteredCosts =
        Costs()
        | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
        | where isnotempty(CommitmentDiscountId)
        | where not(ChargeCategory == 'Purchase' and isnotempty(CommitmentDiscountCategory));
    let commitmentWaste =
        filteredCosts
        | summarize
            UnusedCost = sum(iff(CommitmentDiscountStatus == 'Unused', EffectiveCost, real(0))),
            TotalCost = sum(EffectiveCost)
            by BillingCurrency, CommitmentDiscountId, CommitmentDiscountName, CommitmentDiscountType
        | extend WastePercent = iff(TotalCost == 0.0, 0.0, todouble(UnusedCost) / todouble(TotalCost) * 100.0)
        | project
            BillingCurrency,
            CommitmentDiscountId,
            CommitmentDiscountName,
            CommitmentDiscountType,
            UnusedCost = todouble(UnusedCost),
            TotalCost = todouble(TotalCost),
            WastePercent = todouble(WastePercent);
    let grandTotals =
        filteredCosts
        | summarize
            UnusedCost = sum(iff(CommitmentDiscountStatus == 'Unused', EffectiveCost, real(0))),
            TotalCost = sum(EffectiveCost)
            by BillingCurrency
        | extend
            CommitmentDiscountId = '',
            CommitmentDiscountName = '(All Commitments)',
            CommitmentDiscountType = ''
        | extend WastePercent = iff(TotalCost == 0.0, 0.0, todouble(UnusedCost) / todouble(TotalCost) * 100.0)
        | project
            BillingCurrency,
            CommitmentDiscountId,
            CommitmentDiscountName,
            CommitmentDiscountType,
            UnusedCost = todouble(UnusedCost),
            TotalCost = todouble(TotalCost),
            WastePercent = todouble(WastePercent);
    union commitmentWaste, grandTotals
    | order by BillingCurrency asc, WastePercent desc, CommitmentDiscountName asc
    | project
        BillingCurrency,
        CommitmentDiscountId,
        CommitmentDiscountName,
        CommitmentDiscountType,
        UnusedCost,
        TotalCost,
        WastePercent
  parameters:
  - name: startDate
    type: string
    description: datetime = startofmonth(ago(30d))
    required: true
  - name: endDate
    type: string
    description: datetime = startofmonth(now())
    required: true
