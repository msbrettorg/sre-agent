api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: anomaly-detection-rate
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Calculates the percentage of effective spend attributable to anomaly-flagged days. Builds daily cost series
    per service category and billing currency, then applies time-series anomaly detection. KPI: Anomaly Detection Rate Formula:
    Total Cost of Anomaly Spikes / Total Spend = Anomaly Cost % Author: FinOps toolkit'
  database: Hub
  query: |-
    let startDate = ##startDate##;
    let endDate = ##endDate##;
    let sensitivity = ##sensitivity##;
    let expanded = materialize(
        Costs()
        | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
        | where not(ChargeCategory == 'Purchase' and isnotempty(CommitmentDiscountCategory))
        | summarize DailyCost = sum(todouble(EffectiveCost))
            by bin(ChargePeriodStart, 1d), ServiceCategory, BillingCurrency
        | make-series CostSeries = sum(DailyCost) default=0.0
            on ChargePeriodStart from startDate to endDate step 1d
            by ServiceCategory, BillingCurrency
        | extend AnomalyFlags = series_decompose_anomalies(CostSeries, sensitivity)
        | mv-expand CostSeries to typeof(double), AnomalyFlags to typeof(int)
    );
    let perCategory =
        expanded
        | summarize
            AnomalyCost = todouble(sumif(CostSeries, AnomalyFlags != 0)),
            TotalCost = todouble(sum(CostSeries))
            by BillingCurrency, ServiceCategory
        | extend AnomalyRatePercent = todouble(iff(TotalCost == 0.0, 0.0, AnomalyCost / TotalCost * 100.0));
    let overall =
        expanded
        | summarize
            AnomalyCost = todouble(sumif(CostSeries, AnomalyFlags != 0)),
            TotalCost = todouble(sum(CostSeries))
            by BillingCurrency
        | extend ServiceCategory = 'Overall'
        | extend AnomalyRatePercent = todouble(iff(TotalCost == 0.0, 0.0, AnomalyCost / TotalCost * 100.0));
    union perCategory, overall
    | project BillingCurrency, ServiceCategory, AnomalyCost, TotalCost, AnomalyRatePercent
  parameters:
  - name: startDate
    type: string
    description: 'datetime; Start date for the reporting period (default: startofmonth(ago(30d)))'
    required: true
  - name: endDate
    type: string
    description: 'datetime; End date for the reporting period (default: startofmonth(now()))'
    required: true
  - name: sensitivity
    type: string
    description: 'real; Anomaly detection sensitivity for series_decompose_anomalies() (default: 1.5)'
    required: true
