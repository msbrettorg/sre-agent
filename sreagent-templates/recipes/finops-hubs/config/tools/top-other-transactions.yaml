api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: top-other-transactions
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: Returns all non-usage, non-commitment (non-RI/SP) purchase transactions from the FinOps Hub Costs() table.
    This query is optimized to only include columns that are populated for these transaction types.
  database: Hub
  query: |-
    let N = ##N##;
    let startDate = ##startDate##; // Default: last month
    let endDate = ##endDate##;
    Costs()
    | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate and tolower(tostring(ChargeCategory)) != 'usage' and isempty(CommitmentDiscountType) and toreal(BilledCost) > 0
    | top N by toreal(BilledCost)
    | project ChargePeriodStart, ChargeCategory, BilledCost, BillingCurrency, SubAccountName, x_InvoiceSectionName, PricingCategory, PricingQuantity, PricingUnit, ProviderName, PublisherName
  parameters:
  - name: N
    type: string
    description: 'Number of top transactions to return (default: 10)'
    required: true
  - name: startDate
    type: string
    description: Start date for the reporting period (e.g., startofmonth(ago(30d)))
    required: true
  - name: endDate
    type: string
    description: End date for the reporting period (e.g., startofmonth(now()))
    required: true
