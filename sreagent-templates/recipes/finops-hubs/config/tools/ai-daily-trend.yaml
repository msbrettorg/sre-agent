api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: ai-daily-trend
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Returns daily Azure OpenAI token consumption and effective cost. Useful for AI workload anomaly detection,
    forecasting, and trend reporting. Author: FinOps Toolkit Team'
  database: Hub
  query: |-
    let startDate = ##startDate##;
    let endDate = ##endDate##;
    Costs()
    | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
    | where x_SkuMeterSubcategory has "OpenAI"
    | summarize
        DailyTokens = sum(ConsumedQuantity),
        DailyCost = sum(EffectiveCost)
        by Day = bin(ChargePeriodStart, 1d), BillingCurrency
    | extend CostPer1KTokens = iff(DailyTokens == 0, 0.0, DailyCost / DailyTokens * 1000)
    | order by Day asc, BillingCurrency asc
  parameters:
  - name: startDate
    type: string
    description: Start date for the reporting period (e.g., ago(30d))
    required: true
  - name: endDate
    type: string
    description: End date for the reporting period (e.g., now())
    required: true
