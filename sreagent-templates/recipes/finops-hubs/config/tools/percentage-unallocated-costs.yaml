api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: percentage-unallocated-costs
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Computes the share of EffectiveCost with no allocation evidence in Costs() using a heuristic: no cost allocation
    rule, no cost center, and no ownership tag key match. KPI: Percentage of Costs Associated with Unallocated CSP Cloud Resources
    Formula: (Total Effective Costs Associated with Unallocated CSP Cloud Resources During a Period of Time / Total CSP Cloud
    Costs During a Period of Time) Author: FinOps toolkit'
  database: Hub
  query: |-
    let startDate = ##startDate##;
    let endDate = ##endDate##;
    let allocationEvidenceTagKeys = ##allocationEvidenceTagKeys##;
    Costs()
    | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
    | where not(ChargeCategory == 'Purchase' and isnotempty(CommitmentDiscountCategory))
    | extend tmp_TagKeys = coalesce(bag_keys(Tags), dynamic([]))
    | extend tmp_HasAllocationEvidenceTag = array_length(set_intersect(tmp_TagKeys, allocationEvidenceTagKeys)) > 0
    | extend tmp_IsUnallocated = isempty(x_CostAllocationRuleName) and isempty(x_CostCenter) and not(tmp_HasAllocationEvidenceTag)
    | summarize
        UnallocatedEffectiveCost = todouble(sum(iff(tmp_IsUnallocated, EffectiveCost, real(0)))),
        TotalEffectiveCost = todouble(sum(EffectiveCost))
        by BillingCurrency
    | extend UnallocatedPercent = todouble(iff(TotalEffectiveCost == 0.0, 0.0, UnallocatedEffectiveCost / TotalEffectiveCost * 100.0))
    | project BillingCurrency, UnallocatedEffectiveCost, TotalEffectiveCost, UnallocatedPercent
  parameters:
  - name: startDate
    type: string
    description: 'datetime; start of the reporting period (default: startofmonth(ago(30d)))'
    required: true
  - name: endDate
    type: string
    description: 'datetime; end of the reporting period (default: startofmonth(now()))'
    required: true
  - name: allocationEvidenceTagKeys
    type: string
    description: dynamic; tag keys that count as allocation evidence
    required: true
