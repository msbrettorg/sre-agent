api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: quarterly-cost-by-resource-group
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: "Returns the top N cost rows (by resource group, subaccount, and month) over the last quarter (3 months). Each\
    \ row represents one resource group in one month \u2014 useful for identifying the highest single-month cost drivers.\
    \ Author: FinOps Toolkit"
  database: Hub
  query: |-
    let N = ##N##;
    let startDate = ##startDate##; // Default: last 3 months
    let endDate = ##endDate##;
    Costs()
    | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
    | as filteredCosts
    | extend x_ChargeMonth = startofmonth(ChargePeriodStart)
    | summarize EffectiveCost = sum(EffectiveCost) by SubAccountName, x_ResourceGroupName, x_ChargeMonth
    | order by x_ChargeMonth desc, EffectiveCost desc
    | top N by EffectiveCost
  parameters:
  - name: N
    type: string
    description: 'Number of top resource groups to return (default: 5)'
    required: true
  - name: startDate
    type: string
    description: Start date for the reporting period (e.g., startofmonth(ago(90d)))
    required: true
  - name: endDate
    type: string
    description: End date for the reporting period (e.g., startofmonth(now()))
    required: true
