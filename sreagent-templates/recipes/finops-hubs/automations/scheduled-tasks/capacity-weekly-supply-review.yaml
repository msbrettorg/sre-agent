api_version: azuresre.ai/v2
kind: ScheduledTask
metadata:
  name: CapacityWeeklySupplyReview
spec:
  name: CapacityWeeklySupplyReview
  description: Weekly FinOps capacity management review — quota headroom, CRG cost optimization, SKU availability, benefit recommendations
  schedule: 0 8 * * 1
  mode: Review
  agent: finops-practitioner
  prompt: '# Weekly FinOps Capacity Management Review


    ## Phase 0: Preparation


    Before starting, search available knowledge and prior memory for relevant context, known issues, and previous findings.

    Output style: Label measured, derived, and estimated evidence; cite each source or derivation; state exact scope and time period; organize findings by FinOps capability; include risk thresholds, confidence, caveats, and required disclaimers.

    Tool routing and delivery guard: This scheduled task is owned by `finops-practitioner`, which has KB-only SearchMemory plus its own Teams delivery tools (`GetMessagesFromChannel`, `PostMessageToConversation`, `ReplyWithMessageToConversation`); it has no Kusto, Azure CLI, Resource Graph, capacity, Outlook, data-collection, or remediation tools. Use the `Task` system tool to invoke specialist subagents for all tool work and pass the full task scope, evidence already collected, open questions, and desired output shape with each `Task` invocation. Use `ftk-database-query` for FinOps Hub Kusto, cost, pricing, recommendation, and transaction query tools. Use `azure-capacity-manager` for capacity, quota, capacity reservation group, SKU availability, database service quota, and benefit recommendation Python tools. Use `ftk-hubs-agent` for FinOps Hub infrastructure health, Resource Graph inventory, data freshness, deployment, remediation, alert and budget deployment, and Advisor suppression operations. Use `chief-financial-officer` only for executive finance framing. For each chart, ask whichever tool-bearing specialist already collected the underlying evidence for that chart (`ftk-database-query` for Kusto/cost evidence, `azure-capacity-manager` for capacity evidence, or `ftk-hubs-agent` for Hub infrastructure evidence) to render it using its own `PlotBarChart`, `PlotPieChart`, or `PlotAreaChartWithCorrelation` tool; do not route a chart to a specialist outside the domain that produced its data. Only `azure-capacity-manager` also has `ExecutePythonCode`; use it only as a fallback chart-generation method within its own capacity-evidence work, never for `ftk-database-query` or `ftk-hubs-agent`, which do not have that tool. Ask each involved specialist to check its own available visualization tools exactly once per run and remember whether `SendOutlookEmail`, `PlotBarChart`, `PlotPieChart`, `PlotAreaChartWithCorrelation`, and, for `azure-capacity-manager` only, `ExecutePythonCode` are present. Do not call notification, email, connector, Microsoft Graph, `dynamicInvoke`, raw webhook, or connector APIs just to test availability. If the specialist that owns the data for a chart has no visualization tool available, provide that data as a chart-ready table or structured specification in the report instead of inventing a tool. Complete the report, and collect any chart artifacts from the specialists, before delivery. `finops-practitioner` delivers the final report to Microsoft Teams itself with its own `PostMessageToConversation` tool; do not delegate Teams delivery to a specialist. When a Teams connector/channel is configured, `finops-practitioner` makes one final `PostMessageToConversation` attempt itself to the configured Teams channel. When an Outlook connector/recipient is configured, ask a tool-bearing specialist involved in this task (`ftk-database-query`, `azure-capacity-manager`, or `ftk-hubs-agent`, all of which have `SendOutlookEmail`) to make one final attempt with the same final report and any generated chart artifacts. If a configured delivery path fails, mark the task/run failed instead of degrading to local output or probing alternate paths. If neither Teams nor Outlook delivery is configured or available, render the completed report in the run output and explicitly state which delivery paths were skipped.



    Orchestration rule: This scheduled task is owned by `finops-practitioner`. Delegate capacity evidence collection and specialist analysis to `azure-capacity-manager`; do not try to run capacity tools directly from the practitioner. When the specialist returns evidence, assemble the final FinOps report, apply the reporting requirements in this task, generate supported visualizations, and deliver the completed output through configured connectors.

    Ask `azure-capacity-manager` to apply its capacity-management guidance during the `Task` invocation.


    Weekly review mapping Azure capacity signals into FinOps Planning & Estimating, Forecasting, Architecting & Workload Placement, Usage Optimization, Rate Optimization support, Governance, Policy & Risk, and Automation, Tools, & Services.

    ## Specialist tools to request from `azure-capacity-manager`

    Ask `azure-capacity-manager` to use the following tools instead of `az` CLI commands when available. Specialist tools use their configured authentication and the agent system-managed identity where required.

    - `quota-headroom` (Kusto, preferred): Takes no parameters and returns every subscription and region in one call, with Headroom and PercentUsed already computed
    - `quota-compute-usage` (Kusto, preferred): Takes no parameters and returns raw compute quota currentValue and limit for every subscription and region
    - `vm-quota-usage`: Python fallback for a live spot-check. Run with subscription_id and location to get VM family quota usage with at-risk thresholds
    - `quota-storage-usage` and `quota-network-usage` (Kusto, preferred): Take no parameters and return Storage and Network quota usage for every subscription and region
    - `non-compute-quotas`: Python fallback for a live spot-check. Run with subscription_id and location to get Storage and Network quota usage
    - `quota-capacity-reservations` (Kusto, preferred): Takes no parameters and returns CRG inventory for every subscription. Inventory only, so currentValue, limit, and unit may be empty
    - `capacity-reservation-groups`: Python fallback when instanceView utilization is needed. Run with subscription_id and resource_group when scoped to list CRGs with instanceView utilization

    - `quota-availability-zone-mappings` (Kusto, preferred): Takes no parameters and returns subscription-specific logical-to-physical zone mappings for every subscription and region
    - `zone-mapping`: Python fallback for a live spot-check. Run with reference_subscription_id, location, and peer_subscription_ids before cross-subscription zonal placement or shared-CRG decisions
    - `quota-compute-resource-skus` (Kusto, preferred for Compute): Takes no parameters and returns VM SKU family, zone, and restriction evidence for every subscription and region
    - `sku-availability`: Ask `azure-capacity-manager` to run with subscription_id and location to get Compute SKU availability and restrictions by default. Use `resource_provider: kusto` with a planned Data Explorer SKU in `sku_filter` to preflight Azure Data Explorer / Kusto eligibility for FinOps Hub analytics deployments; never infer Kusto availability from Compute SKU results. The `kusto` mode has no Kusto-tool equivalent and stays on this tool.
    - `azure-capacity-manager`: Run `benefit-recommendations` with billing_scope and lookback to get reservation and savings plan recommendations
    - `ftk-database-query`: Run `commitment-utilization-score`, `commitment-discount-waste`, `compute-spend-commitment-coverage`, and `compute-cost-per-core` when Kusto cost evidence is available


    ## 1. Quota Headroom Analysis


    Ask `azure-capacity-manager` to run comprehensive quota analysis across all subscriptions using `quota-headroom`, `quota-storage-usage`, and `quota-network-usage`, each of which covers the whole estate in a single call (use `vm-quota-usage` and `non-compute-quotas` for a live spot-check):

    - Aggregate quota usage by VM family across subscriptions

    - Identify families with <20% headroom across the estate

    - Check quota group balances — any group near its limit?

    - Identify quota transfer opportunities between subscriptions

    - Flag subscriptions not yet added to quota groups

    - Report primary headroom and recovery-region or recovery-zone headroom separately, measured in complete workload scale units where workload definitions are available




    ## 2. CRG Cost-Waste Audit


    Ask `azure-capacity-manager` to use `quota-capacity-reservations` to enumerate all capacity reservation groups, then `capacity-reservation-groups` for the instanceView utilization the calculations below need:

    - Calculate weekly cost of unused reserved capacity (reserved minus allocated × pay-as-you-go rate)

    - Calculate net CRG carry cost only after applicable Azure Reservation or savings plan offsets are known

    - Identify CRGs that could be rightsized (reduce reservation quantity)

    - Label reserved-available, consumed, and overallocated states; flag overallocated instances as outside the reserved-capacity SLA

    - Check for CRGs without matching Azure Reservations (paying both capacity guarantee AND full price)


    Key distinction: Capacity reservations guarantee supply. Azure Reservations reduce cost. Best practice is to pair both.




    ## 3. SKU and Zone Availability Validation


    Ask `azure-capacity-manager` to use `quota-compute-resource-skus` to validate SKU and zone availability for shared CRGs and upcoming deployments, falling back to `sku-availability` for a live spot-check:

    - Verify that planned SKUs are available in the required locations and zones

    - Flag any SKU restrictions that could block planned scaling

    - Require a structured fallback SKU, zone, or region with compatibility and deployment-test status for critical workloads

    - Use `quota-availability-zone-mappings`, or `zone-mapping` for a live spot-check, for every cross-subscription zonal or shared-CRG scenario. If mappings are unavailable or stale, report INSUFFICIENT EVIDENCE and do not approve placement.

    - For FinOps Hub Data Explorer backend work, ask `azure-capacity-manager` to run `sku-availability` with `resource_provider: kusto` and the planned ADX SKU as `sku_filter`; treat `is_available: false` as a deploy or upgrade blocker.


    ## 4. Benefit Recommendations


    Ask `azure-capacity-manager` to run `benefit-recommendations` when current RI/SP recommendations are needed. Where Hub cost context is available, ask `ftk-database-query` to run `reservation-recommendation-breakdown`, `commitment-utilization-score`, `commitment-discount-waste`, `compute-spend-commitment-coverage`, and `compute-cost-per-core` for Kusto-backed recommendation, commitment, coverage, and unit-economics evidence.

    Cross-reference with capacity reservation strategy:

    - Do recommended reservations overlap with existing CRGs? (Good — pair pricing with capacity)

    - Are there high-savings recommendations in regions without CRGs? (May need capacity too)


    ## 5. Region and SKU Availability


    Ask `azure-capacity-manager` to use `quota-compute-resource-skus`, or `sku-availability` for a live spot-check, to check for any new region access or zonal enablement needs:

    - Upcoming deployments that need new regions?

    - SKU restrictions blocking planned scaling?




    ## Output


    Produce a weekly FinOps capacity management briefing with:

    - Quota headroom scorecard (🔴🟡🟢 by VM family)

    - CRG utilization and waste summary with dollar amounts

    - Benefit recommendation highlights

    - Action items for platform, engineering, and finance stakeholders

    - Evidence timestamps, freshness, owner, escalation deadline, and any required post-change validation


    Use #remember to note key FinOps capacity findings. Use deep investigation if any quota is critically low.


    ## Deliver



    **Visualizations:** Before delivery, ask the tool-bearing specialist already handling that evidence to generate charts for key findings using its own `PlotBarChart`, `PlotPieChart`, or `PlotAreaChartWithCorrelation` tool when those visualization tools fit the data. Only `azure-capacity-manager` also has `ExecutePythonCode`; use it as a fallback chart-generation method only within its own capacity-evidence work, never for `ftk-database-query` or `ftk-hubs-agent`, which do not have that tool. If the specialist handling that evidence has no visualization tool that can express the required chart, provide the underlying data as a chart-ready table or structured specification instead of inventing a tool. Include at minimum one trend chart and one comparison chart where the data supports it. Verify each generated chart non-visually before embedding by checking the output file exists, has non-zero size, opens as an image, and reports expected dimensions and metadata through code interpreter filesystem or image-library checks. Do not use visual inspection as the verification gate; regenerate or omit any chart that fails these checks and state why. Embed the chart images inline in the Teams message and attach or embed them in the Outlook email alongside the text tables. Charts make the report immediately actionable for stakeholders who scan rather than read.

    **Teams and Outlook (capacity results only):** Post the final weekly capacity briefing to our Teams channel. Include the quota headroom scorecard, CRG waste summary, benefit recommendations, and capacity action items. Do not post intermediate results — only the completed briefing. Ask the selected delivery specialist to use `PostMessageToConversation` and `SendOutlookEmail` only when the delivery guard found each tool available once per run. If neither Teams nor Outlook delivery is configured or available, return the completed report in the run output with a note naming the skipped delivery paths. If any configured Teams or Outlook final delivery attempt fails, do not retry or probe alternate delivery paths; mark the task/run failed.


    **Knowledge base (operational learnings only):** Save any new operational insights to the knowledge base — quota API failures, SKU availability discoveries, CRG query patterns, Python tool workarounds. Never save financial figures, cost amounts, or any customer financial data to the knowledge base. Financial detail goes to configured Teams and Outlook delivery only.'
