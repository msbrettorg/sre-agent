api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: commitment-utilization-score
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Computes commitment utilization by commitment discount ID over the reporting window. Returns per-commitment
    and per-currency grand-total utilization amount, potential, and score. KPI: Commitment Utilization Score Formula: Commitment
    Utilization Score = (Used Commitment / Total Commitment) x 100 Author: FinOps toolkit'
  database: Hub
  query: |-
    let startDate = ##startDate##;
    let endDate = ##endDate##;
    let commitmentRows = materialize(
        Costs()
        | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
        | where isnotempty(CommitmentDiscountId)
        | extend x_CommitmentDiscountUtilizationPotential = case(
            ChargeCategory == 'Purchase', toreal(0),
            ProviderName == 'Microsoft' and isnotempty(CommitmentDiscountCategory), toreal(EffectiveCost),
            CommitmentDiscountCategory == 'Usage', toreal(ConsumedQuantity),
            CommitmentDiscountCategory == 'Spend', toreal(EffectiveCost),
            toreal(0))
        | extend x_CommitmentDiscountUtilizationAmount = iff(CommitmentDiscountStatus == 'Used', x_CommitmentDiscountUtilizationPotential, toreal(0))
    );
    let commitmentSummary =
        commitmentRows
        | summarize
            UtilizationAmount = todouble(sum(x_CommitmentDiscountUtilizationAmount)),
            UtilizationPotential = todouble(sum(x_CommitmentDiscountUtilizationPotential))
            by BillingCurrency, CommitmentDiscountId, CommitmentDiscountName, CommitmentDiscountCategory, CommitmentDiscountType
        | extend UtilizationScore = iff(UtilizationPotential > 0, todouble(UtilizationAmount / UtilizationPotential) * 100.0, todouble(0));
    union
        commitmentSummary,
        (
            commitmentSummary
            | summarize
                UtilizationAmount = todouble(sum(UtilizationAmount)),
                UtilizationPotential = todouble(sum(UtilizationPotential))
                by BillingCurrency
            | extend
                CommitmentDiscountId = '(All)',
                CommitmentDiscountName = '(Grand Total)',
                CommitmentDiscountCategory = '',
                CommitmentDiscountType = '',
                UtilizationScore = iff(UtilizationPotential > 0, todouble(UtilizationAmount / UtilizationPotential) * 100.0, todouble(0))
        )
    | project
        BillingCurrency,
        CommitmentDiscountId,
        CommitmentDiscountName,
        CommitmentDiscountCategory,
        CommitmentDiscountType,
        UtilizationAmount,
        UtilizationPotential,
        UtilizationScore
  parameters:
  - name: startDate
    type: string
    description: 'datetime; start date for the reporting period (default: startofmonth(ago(30d)))'
    required: true
  - name: endDate
    type: string
    description: 'datetime; end date for the reporting period (default: startofmonth(now()))'
    required: true
