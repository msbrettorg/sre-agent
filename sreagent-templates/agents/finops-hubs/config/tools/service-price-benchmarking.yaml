api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: service-price-benchmarking
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Returns list price, contracted price, effective price, negotiated savings (amount and percent), commitment
    savings (amount and percent), and total savings (amount and percent) by service for the last N months (default: 1). Useful
    for benchmarking Azure service pricing and identifying savings opportunities. Author: FinOps Toolkit Team'
  database: Hub
  query: "let startDate = ##startDate##; // Default: last month\nlet endDate = ##endDate##;\nCosts()\n| where ChargePeriodStart\
    \ >= startDate and ChargePeriodStart < endDate\n| extend \n    x_CommitmentDiscountSavings = iif(ContractedCost == 0.0,\
    \ 0.0, toreal(ContractedCost - EffectiveCost)),\n    x_NegotiatedDiscountSavings = iif(ListCost == 0.0, 0.0, toreal(ListCost\
    \ - ContractedCost)),\n    x_TotalSavings = iif(ListCost == 0.0, 0.0, toreal(ListCost - EffectiveCost)),\n    x_CommitmentDiscountPercent\
    \ = iif(ContractedCost == 0.0, 0.0, toreal(ContractedCost - EffectiveCost) * 100.0 / toreal(ContractedCost)),\n    x_NegotiatedDiscountPercent\
    \ = iif(ListCost == 0.0, 0.0, toreal(ListCost - ContractedCost) * 100.0 / toreal(ListCost)),\n    x_TotalDiscountPercent\
    \ = iif(ListCost == 0.0, 0.0, toreal(ListCost - EffectiveCost) * 100.0 / toreal(ListCost))\n| summarize \n    ListCost\
    \ = sum(toreal(ListCost)), \n    ContractedCost = sum(toreal(ContractedCost)), \n    EffectiveCost = sum(toreal(EffectiveCost)),\n\
    \    CommitmentSavings = sum(x_CommitmentDiscountSavings), \n    NegotiatedSavings = sum(x_NegotiatedDiscountSavings),\
    \ \n    TotalSavings = sum(x_TotalSavings),\n    CommitmentSavingsPct = avg(x_CommitmentDiscountPercent), \n    NegotiatedSavingsPct\
    \ = avg(x_NegotiatedDiscountPercent), \n    TotalSavingsPct = avg(x_TotalDiscountPercent)\n    by ServiceName\n| project\
    \ \n    ServiceName, \n    ListCost = round(ListCost, 0), \n    ContractedCost = round(ContractedCost, 0), \n    EffectiveCost\
    \ = round(EffectiveCost, 0), \n    NegotiatedSavings = round(NegotiatedSavings, 0),\n    CommitmentSavings = round(CommitmentSavings,\
    \ 0), \n    TotalSavings = round(TotalSavings, 0), \n    NegotiatedSavingsPct = round(NegotiatedSavingsPct, 0), \n   \
    \ CommitmentSavingsPct = round(CommitmentSavingsPct, 0), \n    TotalSavingsPct = round(TotalSavingsPct, 0)"
  parameters:
  - name: startDate
    type: string
    description: Start date for the reporting period (e.g., startofmonth(ago(30d)))
    required: true
  - name: endDate
    type: string
    description: End date for the reporting period (e.g., startofmonth(now()))
    required: true
