api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: cost-by-financial-hierarchy
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: "Returns the top N costs using the full financial hierarchy: Billing Profile \u2192 Invoice Section \u2192\
    \ Team \u2192 Product \u2192 Application \u2192 Environment. Includes percent of total cost for context. Author: FinOps\
    \ Toolkit"
  database: Hub
  query: |-
    let N = ##N##; // Set to desired number of top results
    let startDate = ##startDate##; // Default: last month
    let endDate = ##endDate##;
    let GrandTotal = toscalar(
        Costs()
        | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
        | summarize sum(toreal(EffectiveCost))
    );
    Costs()
    | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
    | extend x_Team = tostring(Tags['team'])
    | extend x_Product = tostring(Tags['product'])
    | extend x_Application = tostring(Tags['application'])
    | extend x_Environment = tostring(Tags['environment'])
    | summarize EffectiveCost = sum(toreal(EffectiveCost))
        by x_BillingProfileName, x_InvoiceSectionName, x_Team, x_Product, x_Application, x_Environment
    | extend PercentOfTotal = 100.0 * EffectiveCost / GrandTotal
    | project x_BillingProfileName, x_InvoiceSectionName, x_Team, x_Product, x_Application, x_Environment, EffectiveCost, PercentOfTotal
    | order by EffectiveCost desc
    | top N by EffectiveCost
  parameters:
  - name: N
    type: string
    description: 'Number of top results to return (default: 5)'
    required: true
  - name: startDate
    type: string
    description: Start date for the reporting period (e.g., startofmonth(ago(30d)))
    required: true
  - name: endDate
    type: string
    description: End date for the reporting period (e.g., startofmonth(now()))
    required: true
