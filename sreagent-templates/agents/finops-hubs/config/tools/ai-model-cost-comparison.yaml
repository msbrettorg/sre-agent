api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: ai-model-cost-comparison
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: 'Compares token volume, effective cost, list cost, and discount percentage by model. Useful for AI model cost
    efficiency analysis and rate optimization. Author: FinOps Toolkit Team'
  database: Hub
  query: |-
    let startDate = ##startDate##;
    let endDate = ##endDate##;
    Costs()
    | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
    | where x_SkuMeterSubcategory has "OpenAI"
    | extend Model = x_SkuDescription
    | summarize
        TokenCount = sum(ConsumedQuantity),
        EffectiveCost = sum(EffectiveCost),
        ListCost = sum(ListCost)
        by BillingCurrency, Model
    | extend CostPer1KTokens = iff(TokenCount == 0, 0.0, EffectiveCost / TokenCount * 1000)
    | extend ListPer1KTokens = iff(TokenCount == 0, 0.0, ListCost / TokenCount * 1000)
    | extend DiscountPercent = iff(ListCost == 0, 0.0, (ListCost - EffectiveCost) / ListCost * 100)
    | order by EffectiveCost desc
  parameters:
  - name: startDate
    type: string
    description: Start date for the reporting period (e.g., startofmonth(ago(30d)))
    required: true
  - name: endDate
    type: string
    description: End date for the reporting period (e.g., startofmonth(now()))
    required: true
