api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: quota-cognitive-services-usage
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: Rehydrates the latest Azure AI services quota usage records for each subscription and region from FinOps Hub quota data.
  database: Hub
  query: |-
    // Copyright (c) Microsoft Corporation.
    // Licensed under the MIT License.
    //
    // NAME: Azure AI services quota usage
    // DESCRIPTION: Rehydrates the latest Azure AI services quota usage records for each subscription and region.
    // CATEGORY: Governance
    // FEATURE: Quota
    // REGION: All
    // TECH: KQL
    //
    // RESOURCE TYPES: Microsoft.CognitiveServices/locations/usages
    //
    // SOURCE: Quota()
    //

    Quota()
    | where x_SourceType =~ 'CognitiveServicesUsage'
    | where ResourceType =~ 'Microsoft.CognitiveServices/locations/usages'
    | where isnotempty(ResourceName)
    | summarize arg_max(x_IngestionTime, *) by ResourceId
    | project
        ProviderName,
        ResourceId,
        ResourceName,
        ResourceType,
        SubAccountId,
        displayName,
        location,
        currentValue,
        limit,
        unit,
        x_QuotaDetails,
        x_SourceType,
        x_SourceVersion,
        x_IngestionTime
    | order by SubAccountId asc, location asc, ResourceName asc
