api_version: azuresre.ai/v2
kind: ExtendedAgentTool
metadata:
  name: tagging-policy-compliance
spec:
  type: KustoTool
  mode: Query
  connector: finops-hub-kusto
  description: "Computes the FinOps Foundation KPI for Tagging Policy Compliance \u2014 the percentage of effective cloud\
    \ costs associated with resources that satisfy all required tag keys with non-empty values. KPI: Percentage of CSP Cloud\
    \ Costs that are Tagging Policy Compliant Formula: (Total Effective Costs Associated with Tagging Policy Compliant CSP\
    \ Cloud Resources During a Period of Time / Total CSP Cloud Effective Costs During a Period of Time) x 100 Author: FinOps\
    \ toolkit"
  database: Hub
  query: |-
    let startDate = ##startDate##;
    let endDate = ##endDate##;
    let requiredTagKeys = ##requiredTagKeys##;
    let base = materialize(
        Costs()
        | where ChargePeriodStart >= startDate and ChargePeriodStart < endDate
        | where not(ChargeCategory == 'Purchase' and isnotempty(CommitmentDiscountCategory))
        | project BillingCurrency, EffectiveCost = todouble(EffectiveCost), Tags, tmp_TagsString = tostring(Tags)
    );
    let tag_compliance = materialize(
        base
        | summarize Tags = take_any(Tags) by tmp_TagsString
        | extend tmp_TagKeys = coalesce(bag_keys(Tags), dynamic([]))
        | extend tmp_AllKeysPresent = array_length(set_intersect(tmp_TagKeys, requiredTagKeys)) == array_length(requiredTagKeys)
        | mv-apply k = requiredTagKeys to typeof(string) on (
            summarize tmp_AnyValueEmpty = countif(isempty(tostring(Tags[k]))) > 0
        )
        | extend tmp_IsCompliant = tmp_AllKeysPresent and not(tmp_AnyValueEmpty)
        | project tmp_TagsString, tmp_IsCompliant
    );
    base
    | join kind=leftouter tag_compliance on tmp_TagsString
    | summarize
        CompliantEffectiveCost = todouble(sumif(EffectiveCost, tmp_IsCompliant)),
        TotalEffectiveCost = todouble(sum(EffectiveCost))
        by BillingCurrency
    | extend CompliancePercent = iff(TotalEffectiveCost == 0, 0.0, CompliantEffectiveCost / TotalEffectiveCost * 100.0)
    | project BillingCurrency, CompliantEffectiveCost, TotalEffectiveCost, CompliancePercent
  parameters:
  - name: startDate
    type: string
    description: 'datetime; Start date for the reporting period (default: startofmonth(ago(30d)))'
    required: true
  - name: endDate
    type: string
    description: 'datetime; End date for the reporting period (default: startofmonth(now()))'
    required: true
  - name: requiredTagKeys
    type: string
    description: dynamic; Array of tag key strings that must all be present and non-empty
    required: true
