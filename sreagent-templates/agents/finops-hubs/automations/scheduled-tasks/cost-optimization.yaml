api_version: azuresre.ai/v2
kind: ScheduledTask
metadata:
  name: CostOptimization
spec:
  name: CostOptimization
  description: Comprehensive cost optimization report with orphaned resources, rightsizing, and commitment analysis
  schedule: 0 8 * * 1
  mode: Review
  agent: finops-practitioner
  prompt: '# Cost optimization report


    ## Phase 0: Preparation


    Before starting, search available knowledge and prior memory for relevant context, known issues, and previous findings.

    Output style: Label measured, derived, and estimated evidence; cite each source or derivation; state exact scope and time period; organize findings by FinOps capability; include risk thresholds, confidence, caveats, and required disclaimers.

    Tool routing and delivery guard: This scheduled task is owned by `finops-practitioner`, which has KB-only SearchMemory plus its own Teams delivery tools (`GetMessagesFromChannel`, `PostMessageToConversation`, `ReplyWithMessageToConversation`); it has no Kusto, Azure CLI, Resource Graph, capacity, Outlook, data-collection, or remediation tools. Use the `Task` system tool to invoke specialist subagents for all tool work and pass the full task scope, evidence already collected, open questions, and desired output shape with each `Task` invocation. Use `ftk-database-query` for FinOps Hub Kusto, cost, pricing, recommendation, and transaction query tools. Use `azure-capacity-manager` for capacity, quota, capacity reservation group, SKU availability, database service quota, and benefit recommendation Python tools. Use `ftk-hubs-agent` for FinOps Hub infrastructure health, Resource Graph inventory, data freshness, deployment, remediation, alert and budget deployment, and Advisor suppression operations. Use `chief-financial-officer` only for executive finance framing. For each chart, ask whichever tool-bearing specialist already collected the underlying evidence for that chart (`ftk-database-query` for Kusto/cost evidence, `azure-capacity-manager` for capacity evidence, or `ftk-hubs-agent` for Hub infrastructure evidence) to render it using its own `PlotBarChart`, `PlotPieChart`, or `PlotAreaChartWithCorrelation` tool; do not route a chart to a specialist outside the domain that produced its data. Only `azure-capacity-manager` also has `ExecutePythonCode`; use it only as a fallback chart-generation method within its own capacity-evidence work, never for `ftk-database-query` or `ftk-hubs-agent`, which do not have that tool. Ask each involved specialist to check its own available visualization tools exactly once per run and remember whether `SendOutlookEmail`, `PlotBarChart`, `PlotPieChart`, `PlotAreaChartWithCorrelation`, and, for `azure-capacity-manager` only, `ExecutePythonCode` are present. Do not call notification, email, connector, Microsoft Graph, `dynamicInvoke`, raw webhook, or connector APIs just to test availability. If the specialist that owns the data for a chart has no visualization tool available, provide that data as a chart-ready table or structured specification in the report instead of inventing a tool. Complete the report, and collect any chart artifacts from the specialists, before delivery. `finops-practitioner` delivers the final report to Microsoft Teams itself with its own `PostMessageToConversation` tool; do not delegate Teams delivery to a specialist. When a Teams connector/channel is configured, `finops-practitioner` makes one final `PostMessageToConversation` attempt itself to the configured Teams channel. When an Outlook connector/recipient is configured, ask a tool-bearing specialist involved in this task (`ftk-database-query`, `azure-capacity-manager`, or `ftk-hubs-agent`, all of which have `SendOutlookEmail`) to make one final attempt with the same final report and any generated chart artifacts. If a configured delivery path fails, mark the task/run failed instead of degrading to local output or probing alternate paths. If neither Teams nor Outlook delivery is configured or available, render the completed report in the run output and explicitly state which delivery paths were skipped.



    Generate a comprehensive cost optimization report for the current Azure environment. Works with or without FinOps hubs.

    ## Specialist tools to request for this task

    The following Python tools provide real Azure data via ARM REST API. Always use these instead of `az` CLI commands when available. Specialist tools use their configured authentication and the agent system-managed identity where required.

    - `ftk-hubs-agent`: Run `resource-graph-query` with query and subscriptions to execute Azure Resource Graph KQL for orphaned resource detection
    - `azure-capacity-manager`: Run `benefit-recommendations` with billing_scope and lookback to get reservation and savings plan recommendations
    - `ftk-database-query`: Run Kusto KPI tools when a FinOps hub is connected, especially `cost-optimization-index`, `commitment-utilization-score`, `commitment-discount-waste`, `compute-spend-commitment-coverage`, `compute-cost-per-core`, `cost-per-gb-stored`, and `storage-tier-distribution`


    ## Phase 1: Discovery


    1. Determine scope from the configured scheduled-task scope, documented knowledge-base scope, or current authenticated context. Do not wait for user input during this scheduled run. If scope cannot be determined, report the missing scope as a blocking configuration issue.

    2. Verify authentication: confirm Python tools are using DefaultAzureCredential with the agent system-managed identity.

    3. Check permissions: Reader role is sufficient for all detection queries. Note if elevated permissions are available.

    4. Check for FinOps hubs: Read `.ftk/environments.local.md` to see if a FinOps hub is connected. If available, note it for Phase 2.


    ## Phase 2: Data collection


    Run these data collection steps in parallel where possible. Use #remember to note key intermediate findings as you go.


    ### 2a: Orphaned resources


    Detect unused resources generating waste with zero workload value.


    Ask `ftk-hubs-agent` to run `resource-graph-query` to scan for:

    - Unattached managed disks

    - Unused network interfaces

    - Orphaned public IP addresses

    - Idle NAT gateways

    - Orphaned snapshots (source disk deleted, age > 30 days)

    - Idle load balancers (empty backend pools)

    - Empty availability sets

    - Orphaned NSGs


    For each category, capture: count, estimated monthly cost, resource list.


    ### 2b: Advisor cost recommendations


    Query Azure Advisor for all cost recommendations. Ask `ftk-hubs-agent` to run `resource-graph-query` for Advisor recommendation inventory.


    Categorize recommendations by type: right-size VMs, shutdown idle VMs, reserved instances, delete unused disks, and other.


    Calculate total potential monthly savings from Advisor.


    ### 2c: Commitment discount status


    Analyze current commitment discount coverage and opportunities. Ask `azure-capacity-manager` to run `benefit-recommendations` for new reservation and savings plan purchase recommendations.


    Collect:

    - Current savings plan coverage and utilization

    - Current reservation coverage and utilization

    - New purchase recommendations from the Benefit Recommendations API

    - Gap analysis: what percentage of eligible compute spend is covered


    Evaluate new purchases by expected savings, utilization risk, commitment term, workload stability, flexibility, and business plans.


    ### 2d: FinOps hubs data (if available)


    If a FinOps hub is connected from Phase 1, do not run Kusto directly. Ask `ftk-database-query` to collect these evidence packages with the connected cluster URI, database, and analysis window:


    - `monthly-cost-trend` for the last three complete months.

    - `top-services-by-cost` for the current and prior complete month.

    - `cost-by-region-trend` when placement or capacity decisions affect optimization.

    - `cost-anomaly-detection` for unusual service-level spikes or drops.

    - `cost-optimization-index`, `commitment-utilization-score`, `commitment-discount-waste`, `compute-spend-commitment-coverage`, `compute-cost-per-core`, `cost-per-gb-stored`, and `storage-tier-distribution` for the generated FinOps KPI optimization scorecard.


    Use the returned evidence to identify cost anomalies and trends that inform optimization priorities.


    ## Phase 3: Analysis


    ### 3a: Validate top rightsizing recommendations


    For the top 5 Advisor right-size VM recommendations (by savings amount), validate with the Retail Prices API.


    Use the available retail-pricing tool to look up current and target SKU prices. Compare Advisor''s estimated savings against actual retail price deltas.


    ### 3b: VM utilization deep dive (if VM Insights available)


    For the top rightsizing candidates, check actual utilization metrics if VM Insights is enabled.


    Evaluate:

    - 14-day CPU P95 analysis

    - Memory utilization (if VM Insights agent deployed)

    - Burst pattern detection (P99 check)


    Skip this step if VM Insights is not available — note it as a recommendation for future optimization maturity.


    ### 3c: Categorize by effort and risk

    Before categorizing, ask `azure-capacity-manager` to use `non-compute-quotas` to identify Storage and Network quota pressure that may affect optimization feasibility.


    Organize all findings into four categories:


    | Category | Effort | Risk | Examples |

    |----------|--------|------|----------|

    | **Quick wins** | Low | Zero | Delete orphaned resources, remove unused IPs |

    | **Rightsizing** | Medium | Low | Resize underutilized VMs (requires restart) |

    | **Commitment optimization** | Medium | Medium | Purchase savings plans or reservations |

    | **Architecture changes** | High | Variable | Redesign for cost efficiency, migrate to PaaS |


    ## Phase 4: Report


    Generate a markdown report with the following structure:


    ### Report template


    ```markdown

    # Cost Optimization Report — {subscription/environment name}

    **Generated:** {date}

    **Scope:** {subscription(s) or management group}

    **FinOps Hubs:** {connected / not connected}


    ## Executive summary


    - **Total identified monthly savings:** ${amount}

    - **Quick wins (zero risk):** ${amount} across {count} resources

    - **Rightsizing opportunities:** ${amount} across {count} VMs

    - **Commitment discount opportunities:** ${amount} estimated

    - **Current commitment coverage:** {percentage}%


    ## Quick wins — orphaned resources


    | Resource Type | Count | Est. Monthly Cost | Action |

    |--------------|-------|-------------------|--------|

    | Unattached disks | {n} | ${cost} | Delete |

    | Orphaned public IPs | {n} | ${cost} | Delete |

    | ... | ... | ... | ... |

    | **Total** | **{n}** | **${cost}** | |


    ## Rightsizing recommendations


    ### Top VM recommendations (validated)


    | VM | Current SKU | Target SKU | CPU P95 | Savings/mo | Risk |

    |----|-------------|------------|---------|------------|------|

    | {name} | {current} | {target} | {%} | ${savings} | Low |

    | ... | ... | ... | ... | ... | ... |


    {Include notes on burst patterns, memory utilization where available}


    ## Commitment discount opportunities


    ### Current coverage

    - Savings plan utilization: {%}

    - Reservation utilization: {%}

    - Total eligible compute covered: {%}


    ### Recommendations

    {Summarize Benefit Recommendations API findings}

    {Reference azure-commitment-discount-decision.md framework for purchase guidance}


    ## Cost trends (FinOps hubs)

    {Include if FinOps hubs connected, otherwise note: "Connect FinOps hubs for trend analysis — run /ftk-hubs-connect"}


    ## Next steps


    1. **Immediate (this week):** Delete orphaned resources — ${amount}/mo savings

    2. **Short-term (this month):** Resize top {n} VMs — ${amount}/mo savings

    3. **Medium-term (this quarter):** Evaluate commitment discount purchases

    4. **Ongoing:** Deploy VM Insights for memory-aware rightsizing, connect FinOps hubs for trend analysis


    ## Audit trail


    | Data Source | Query Time | Records |

    |-------------|-----------|---------|

    | Resource Graph (orphaned) | {timestamp} | {count} |

    | Advisor recommendations | {timestamp} | {count} |

    | Benefit Recommendations API | {timestamp} | {count} |

    | FinOps hubs (if connected) | {timestamp} | {count} |

    ```


    ### Report guidance


    - Format all currency values with the appropriate billing currency

    - Include resource IDs or names for actionable items

    - Flag any data gaps (e.g., "Memory metrics unavailable — VM Insights not deployed")

    - If FinOps hubs are not connected, recommend `/ftk-hubs-connect` for deeper analysis

    - Do not save task reports or financial data to the git repository — use #remember for key operational findings instead


    ## Phase 5: Deliver



    **Visualizations:** Before delivery, ask the tool-bearing specialist already handling that evidence to generate charts for key findings using its own `PlotBarChart`, `PlotPieChart`, or `PlotAreaChartWithCorrelation` tool when those visualization tools fit the data. Only `azure-capacity-manager` also has `ExecutePythonCode`; use it as a fallback chart-generation method only within its own capacity-evidence work, never for `ftk-database-query` or `ftk-hubs-agent`, which do not have that tool. If the specialist handling that evidence has no visualization tool that can express the required chart, provide the underlying data as a chart-ready table or structured specification instead of inventing a tool. Include at minimum one trend chart and one comparison chart where the data supports it. Verify each generated chart non-visually before embedding by checking the output file exists, has non-zero size, opens as an image, and reports expected dimensions and metadata through code interpreter filesystem or image-library checks. Do not use visual inspection as the verification gate; regenerate or omit any chart that fails these checks and state why. Embed the chart images inline in the Teams message and attach or embed them in the Outlook email alongside the text tables. Charts make the report immediately actionable for stakeholders who scan rather than read.

    **Teams and Outlook (financial results only):** Post the final cost optimization report to our Teams channel. Include the executive summary, total identified savings, quick wins, and prioritized next steps. Do not post intermediate results — only the completed report. Ask the selected delivery specialist to use `PostMessageToConversation` and `SendOutlookEmail` only when the delivery guard found each tool available once per run. If neither Teams nor Outlook delivery is configured or available, return the completed report in the run output with a note naming the skipped delivery paths. If any configured Teams or Outlook final delivery attempt fails, do not retry or probe alternate delivery paths; mark the task/run failed.


    **Knowledge base (operational learnings only):** Save any new operational insights to the knowledge base — query failures, Resource Graph workarounds, Advisor API patterns, tool errors encountered. Never save financial figures, cost amounts, savings numbers, or any customer financial data to the knowledge base. Financial detail goes to configured Teams and Outlook delivery only.'
